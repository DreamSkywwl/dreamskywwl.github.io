<!DOCTYPE html>
<html lang="zh-CN">

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
简单页面</title>
<style>
    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }

    .card {
        background: #fff;
        border-radius: 16px;
        padding: 48px 40px;
        box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        max-width: 480px;
        width: 100%;
        text-align: center;
    }

    h1 {
        color: #333;
        font-size: 32px;
        margin-bottom: 16px;
    }

    p {
        color: #666;
        font-size: 16px;
        line-height: 1.7;
        margin-bottom: 28px;
    }

    .btn {
        display: inline-block;
        padding: 12px 32px;
        background: linear-gradient(135deg, #667eea, #764ba2);
        color: #fff;
        border: none;
        border-radius: 8px;
        font-size: 16px;
        cursor: pointer;
        transition: transform 0.2s, box-shadow 0.2s;
        text-decoration: none;
    }

    .btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 20px rgba(102, 126, 234, 0.4);
    }

    .info {
        margin-top: 28px;
        padding-top: 24px;
        border-top: 1px solid #eee;
        color: #999;
        font-size: 14px;
    }

    @media (max-width: 480px) {
        .card {
            padding: 32px 24px;
        }

        h1 {
            font-size: 26px;
        }
    }
</style>
</head>

<div class="card">
    👋 你好，世界！</h1>
    这是一个简单的 HTML 页面，使用纯原生 HTML/CSS 编写，无需任何依赖，直接在浏览器中打开即可查看。</p>
    <button class="btn" onclick="showMessage()">点击我</button>
    <div class="info">纯原生 · 响应式 · 零依赖</div>
</div>


function showMessage() {
alert('🎉 恭喜！页面运行正常！');
}
</script>
</body>

</html>
